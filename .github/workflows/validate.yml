name: Validate media network templates
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: "python3 scripts/build.py"
      - run: "python3 scripts/diagnose.py --help"
      - run: "python3 -c \"from pathlib import Path; names=['surge-rules.conf','clash-provider.yaml','quanx-filter.conf']; assert all((Path('generated')/n).stat().st_size>40 for n in names)\""
